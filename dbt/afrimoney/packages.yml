packages:
  # Cross-database utility macros — surrogate keys, date spines, pivots, generic tests.
  - package: dbt-labs/dbt_utils
    version: [">=1.1.1", "<2.0.0"]

  # Great Expectations-style assertions. Used for distributional and
  # range checks that plain generic tests can't express.
  - package: calogica/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]

  # Row-count and column-level diffing between two relations. Used in CI to
  # prove a refactor is non-breaking before it merges.
  - package: dbt-labs/audit_helper
    version: [">=0.12.0", "<0.13.0"]

  # Generates model/source YAML boilerplate from the warehouse. Dev-time only.
  - package: dbt-labs/codegen
    version: [">=0.12.0", "<0.13.0"]
