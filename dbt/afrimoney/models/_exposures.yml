version: 2

# ═══════════════════════════════════════════════════════════════════════════════
# EXPOSURES
#
# Exposures close the last mile of lineage. Without them the DAG stops at the
# gold marts and the honest answer to "what breaks if I change mart_remittance?"
# is "nobody knows, ask around". With them, `dbt ls --select +exposure:*` names
# every downstream consumer, and the docs site renders them on the lineage graph.
#
# The practical payoff is the CI gate: a pull request touching a model that feeds
# a critical exposure gets flagged for review rather than merged on a green tick.
# ═══════════════════════════════════════════════════════════════════════════════

exposures:

  - name: powerbi_executive_dashboard
    label: "Power BI — AfriMoney Executive Dashboard"
    type: dashboard
    maturity: high
    url: https://app.powerbi.com/groups/afrimoney/reports/executive
    description: >
      Board-level monthly view: volume, net revenue, corridor mix, success rate
      and fraud bps. Connected via DirectQuery against GOLD, so a failed build
      shows as stale rather than broken — which is more dangerous, not less.
    owner:
      name: Anthony Apollis
      email: anthony.apollis@gmail.com
    depends_on:
      - ref('mart_remittance')
      - ref('mart_customer_360')
      - ref('mart_fx_profitability')

  - name: ops_corridor_wallboard
    label: "Ops Floor — Live Corridor Wallboard"
    type: dashboard
    maturity: high
    url: https://app.powerbi.com/groups/afrimoney/reports/ops-live
    description: >
      Always-on wallboard in the operations centre. Refreshes off the
      mart_corridor_live Dynamic Table on a 5-minute lag. This is the only
      consumer with a genuine sub-hourly latency requirement, and the sole reason
      that table is not a batch mart.
    owner:
      name: Anthony Apollis
      email: anthony.apollis@gmail.com
    depends_on:
      - ref('mart_corridor_live')

  - name: finance_reconciliation_signoff
    label: "Finance — Monthly Reconciliation Sign-off"
    type: analysis
    maturity: high
    url: https://afrimoney.netlify.app/corridor_settlement_reconciliation
    description: >
      The month-end control pack Finance and Treasury sign against. Because a
      human signature is attached to these figures, any change to the upstream
      reconciliation models is a controlled change — hence maturity: high and a
      named owner outside the data team.
    owner:
      name: Finance Operations
      email: anthony.apollis@gmail.com
    depends_on:
      - ref('mart_reconciliation')
      - ref('int_payment_reconciliation')
      - ref('int_payout_reconciliation')

  - name: snowpark_ml_feature_pipeline
    label: "Snowpark ML — Fraud / Churn / Credit PD Feature Store"
    type: ml
    maturity: medium
    description: >
      Feature store feeding the three registered models (fraud AUC 0.958, churn
      AUC 0.991, credit PD AUC 0.947). Declared as an exposure because training
      data lineage is a model-governance requirement: when a regulator asks what
      fed a credit decision, this edge is the answer.
    owner:
      name: Anthony Apollis
      email: anthony.apollis@gmail.com
    depends_on:
      - ref('int_transfer_profitability')
      - ref('int_customer_transfer_stats')
      - ref('mart_customer_360')

  - name: afrimoney_interactive_map
    label: "Interactive Corridor Intelligence Map"
    type: application
    maturity: medium
    url: https://afrimoney.netlify.app/ebook/afrimoney_map
    description: >
      Public-facing Leaflet map with corridor clustering, ML features and FX
      views. Static export refreshed from the gold marts.
    owner:
      name: Anthony Apollis
      email: anthony.apollis@gmail.com
    depends_on:
      - ref('mart_remittance')
      - ref('mart_fx_profitability')
      - ref('corridor_reference')

  - name: excel_dashboard_workbook
    label: "Excel — AfriMoney_Dashboard.xlsx"
    type: dashboard
    maturity: low
    description: >
      Ten-sheet distributable workbook generated by scripts/step2_excel.py.
      Deliberately marked maturity: low — it is a point-in-time export with no
      live connection, so it goes stale the moment the marts move. Recording that
      honestly in the exposure is the point.
    owner:
      name: Anthony Apollis
      email: anthony.apollis@gmail.com
    depends_on:
      - ref('mart_remittance')
      - ref('mart_reconciliation')
      - ref('mart_risk_compliance')
      - ref('mart_loans_mukuru')
      - ref('mart_wallet_card')
